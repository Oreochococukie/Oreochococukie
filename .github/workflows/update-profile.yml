name: Update live profile

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Refresh GitHub data and SVGs
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: Oreochococukie
        run: python scripts/update_stats.py

      - name: Record each profile refresh as Oreochococukie
        run: |
          git config user.name "Oreochococukie"
          git config user.email "102867217+Oreochococukie@users.noreply.github.com"
          git add stats.json profile-dark.svg profile-light.svg
          git commit --allow-empty -m "Keep the public profile synchronized with GitHub activity"
          git push
